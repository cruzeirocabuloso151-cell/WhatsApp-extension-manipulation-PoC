# SearXNG config para HackerAI Offline
use_default_settings: true

general:
  debug: false
  instance_name: "HackerAI Search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "pt-BR"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120

server:
  secret_key: "hackerai-searxng-secret"
  bind_address: "0.0.0.0"
  port: 8080
  base_url: false
  limiter: false

ui:
  static_use_hash: false
  default_locale: "pt-BR"
  query_in_title: true
  infinite_scroll: false
  default_theme: simple
  center_alignment: false

# Engines habilitados
engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

  - name: github
    engine: github
    shortcut: gh
    disabled: false

  - name: stackoverflow
    engine: stackoverflow
    shortcut: so
    disabled: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 30.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
