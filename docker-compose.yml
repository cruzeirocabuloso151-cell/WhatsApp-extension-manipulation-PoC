version: "3.9"

# HackerAI Offline Stack
# LM Studio (host) + Qwen/Ollama (docker) + Docker Sandboxes + SearXNG
#
# Usage:
#   docker compose up -d
#   Open http://localhost:3000

services:

  # ─── LLM Backend: Ollama com Qwen ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: hackerai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    # GPU: descomentar se tiver NVIDIA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─── Pull Qwen automaticamente ────────────────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: hackerai-ollama-init
    depends_on:
      - ollama
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "
        sleep 5 &&
        ollama pull qwen2.5-coder:7b &&
        ollama pull qwen2.5:7b &&
        echo 'Modelos prontos!'
      "
    volumes:
      - ollama_data:/root/.ollama

  # ─── Web Search: SearXNG (sem API key, 100% offline) ──────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: hackerai-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # ─── Redis: state + task queue ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hackerai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  # ─── Agent Backend ────────────────────────────────────────────────────────
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: hackerai-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # LM Studio rodando no host na porta 1234 (OpenAI-compatible API)
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:1234}
      - LM_STUDIO_MODEL=${LM_STUDIO_MODEL:-local-model}
      # Ollama com Qwen (dentro do docker)
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      # Qual backend usar como principal: lm_studio | ollama
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      # SearXNG
      - SEARXNG_URL=http://searxng:8080
      # Redis
      - REDIS_URL=redis://redis:6379
      # Docker (para criar sandboxes)
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
      - SANDBOX_IMAGE=hackerai-sandbox:latest
      - SANDBOX_NETWORK=hackerai_sandbox_net
      # Segurança
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-32chars}
      - MAX_CONCURRENT_SANDBOXES=${MAX_CONCURRENT_SANDBOXES:-4}
      - SANDBOX_TIMEOUT_SECONDS=${SANDBOX_TIMEOUT_SECONDS:-300}
    volumes:
      # Acesso ao Docker daemon para criar sandboxes
      - /var/run/docker.sock:/var/run/docker.sock
      # Dados persistentes
      - agent_data:/app/data
      - ./agent:/app:ro  # código (read-only em prod)
    depends_on:
      - redis
      - ollama
      - searxng
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Sandbox Base: pre-build da imagem ────────────────────────────────────
  sandbox-builder:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: hackerai-sandbox:latest
    container_name: hackerai-sandbox-builder
    command: echo "Sandbox image built successfully"
    restart: "no"

  # ─── Web UI ───────────────────────────────────────────────────────────────
  ui:
    image: nginx:alpine
    container_name: hackerai-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - agent

networks:
  default:
    name: hackerai_default
  sandbox_net:
    name: hackerai_sandbox_net
    driver: bridge
    internal: true  # sandboxes sem acesso externo direto

volumes:
  ollama_data:
  redis_data:
  agent_data:
